<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title >Education Hub</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #131a2a;
      --card-hover: #1a243b;
      --accent-blue: #2563eb;
      --accent-hover: #1d4ed8;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
    }

    .navbar {
      background: #070a12;
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .logo {
      font-size: 1.3rem;
      color: var(--text-main);
      cursor: pointer;
      font-weight: bold;
    }

    .btn-back {
      background: #1e293b;
      color: var(--text-main);
      border: none;
      padding: 0.4rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      display: none;
      font-weight: bold;
    }

    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .page-view { display: none; }
    .page-view.active { display: block; }

    .section-title {
      text-align: center;
      color: #38bdf8;
      margin-bottom: 2rem;
      font-size: 1.8rem;
    }

    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; }
    .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-blue);
    }

    .card h2, .card h3 { color: var(--text-main); margin-bottom: 0.5rem; }
    .card p { color: var(--text-muted); font-size: 0.9rem; }

    .class-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .thumbnail-box {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      cursor: pointer;
      position: relative;
    }

    .thumbnail-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .class-content {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .class-title { font-size: 1.1rem; margin-bottom: 0.5rem; }
    .topics-list { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem; flex-grow: 1; }
    .materials-label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.4rem; }

    .btn-sheet {
      display: inline-block;
      background: var(--accent-blue);
      color: white;
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      text-align: center;
      border: none;
      cursor: pointer;
    }

    .btn-sheet:hover { background: var(--accent-hover); }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <button id="back-btn" class="btn-back" onclick="goBack()">← back</button>
      <h1 class="logo" onclick="navigateTo('home')">Education Hub</h1>
    </div>
  </header>

  <main class="container">
    <!-- View 1: Track Selection -->
    <section id="view-home" class="page-view active">
      <h2 class="section-title">Select Track</h2>
      <div class="grid-2">
        <div class="card track-card" onclick="selectTrack('varsity')">

        </div>
        <div class="card track-card" onclick="selectTrack('medical')">
          <h2>Medical Preparation</h2>
          <p>Physics, Chemistry, Biology, English, General Knowledge</p>
        </div>
      </div>
    </section>

    <!-- View 2: Subject List -->
    <section id="view-subjects" class="page-view">
      <h2 id="subject-heading" class="section-title">Subjects</h2>
      <div id="subjects-grid" class="grid-3"></div>
    </section>

    <!-- View 3: Chapter List -->
    <section id="view-chapters" class="page-view">
      <h2 id="chapter-heading" class="section-title">Chapters</h2>
      <div id="chapters-grid" class="grid-3"></div>
    </section>

    <!-- View 4: Class Cards -->
    <section id="view-classes" class="page-view">
      <h2 id="class-heading" class="section-title">Classes</h2>
      <div id="classes-grid" class="grid-cards"></div>
    </section>

    <!-- View 5: Video Player -->
    <section id="view-player" class="page-view">
      <div class="player-header">
        <h2 id="player-title">Class Lecture</h2>
        <a id="player-pdf-btn" target="_blank" class="btn-sheet">Lecture Sheet</a>
      </div>
      <div class="video-wrapper">
        <iframe id="video-frame" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
    </section>
  </main>

    let navigationHistory = ['home'];

    function getYoutubeId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function navigateTo(viewId, pushState = true) {
      document.querySelectorAll('.page-view').forEach(el => el.classList.remove('active'));
      document.getElementById(`view-${viewId}`).classList.add('active');

      const backBtn = document.getElementById('back-btn');
      backBtn.style.display = viewId === 'home' ? 'none' : 'block';

      if (pushState) {
        navigationHistory.push(viewId);
      }
    }

    function goBack() {
      if (navigationHistory.length > 1) {
        navigationHistory.pop();
        const previousView = navigationHistory[navigationHistory.length - 1];
        navigateTo(previousView, false);
      }
    }

    function selectTrack(trackKey) {
      const track = courseData[trackKey];
      document.getElementById('subject-heading').innerText = track.title;
      
      const container = document.getElementById('subjects-grid');
      container.innerHTML = '';

      track.subjects.forEach(sub => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<h3>${sub.name}</h3>`;
        card.onclick = () => selectSubject(sub.id, sub.name);
        container.appendChild(card);
      });

      navigateTo('subjects');
    }

    function selectSubject(subjectId, subjectName) {
      document.getElementById('chapter-heading').innerText = subjectName;
      const container = document.getElementById('chapters-grid');
      container.innerHTML = '';

      const chapterList = courseData.chapters[subjectId] || [];

      if (chapterList.length === 0) {
        container.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:var(--text-muted);">No chapters added yet.</p>';
      } else {
        chapterList.forEach(ch => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `<h3>${ch.name}</h3>`;
          card.onclick = () => selectChapter(ch.id, ch.name);
          container.appendChild(card);
        });
      }

      navigateTo('chapters');
    }

    function selectChapter(chapterId, chapterName) {
      document.getElementById('class-heading').innerText = chapterName;
      const container = document.getElementById('classes-grid');
      container.innerHTML = '';

      const classList = courseData.classes[chapterId] || [];

      if (classList.length === 0) {
        container.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:var(--text-muted);">No classes added for this chapter yet.</p>';
      } else {
        classList.forEach(cls => {
          const ytId = getYoutubeId(cls.youtubeUrl);
          const thumbUrl = ytId ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg` : '';

          const card = document.createElement('div');
          card.className = 'class-card';
          card.innerHTML = `
            <div class="thumbnail-box" onclick="playVideo('${cls.title}', '${cls.youtubeUrl}', '${cls.pdfUrl}')">
              <img src="${thumbUrl}" alt="${cls.title}">
            </div>
            <div class="class-content">
              <h3 class="class-title">${cls.title}</h3>
              <p class="topics-list"><strong>Topics:</strong> ${cls.topics}</p>
              <div class="materials-label">Lesson Materials:</div>
              <a href="${cls.pdfUrl}" target="_blank" class="btn-sheet">Lecture Sheet</a>
            </div>
          `;
          container.appendChild(card);
        });
      }

      navigateTo('classes');
    }

    function playVideo(title, youtubeUrl, pdfUrl) {
      const ytId = getYoutubeId(youtubeUrl);
      document.getElementById('player-title').innerText = title;
      
      const pdfBtn = document.getElementById('player-pdf-btn');
      pdfBtn.href = pdfUrl;
      
      const frame = document.getElementById('video-frame');
      frame.src = `https://www.youtube-nocookie.com/embed/${ytId}?autoplay=1&modestbranding=1&rel=0&iv_load_policy=3`;

      navigateTo('player');
    }
